<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMO Hub Wise Operations Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center font-bold text-xl shadow-md">📊</div>
                <div>
                    <h1 class="text-lg font-extrabold tracking-tight">EMO HUB WISE DASHBOARD</h1>
                    <p class="text-xs text-slate-400">Live Operations & Hourly Performance Tracking</p>
                </div>
            </div>
            <div class="flex items-center gap-3 flex-wrap">
                <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700 text-xs">
                    <span class="text-slate-400">Date:</span>
                    <select id="dateSelect" class="bg-slate-900 text-white font-bold px-2 py-1 rounded-lg border border-slate-600 focus:outline-none">
                        <option value="">Loading dates...</option>
                    </select>
                </div>
                <button onclick="loadData()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md transition-all flex items-center gap-1.5 cursor-pointer">
                    <span>🔄</span> Refresh Data
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
        <!-- Search & Stats Bar -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <div class="relative w-full md:w-80">
                <input type="text" id="searchInput" placeholder="Search hub name..." oninput="renderDashboard()" class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <span class="absolute left-3 top-2.5 text-slate-400 text-xs">🔍</span>
            </div>
            <div class="flex items-center gap-3 text-xs font-bold text-slate-600">
                <span class="px-3 py-1.5 bg-emerald-50 text-emerald-700 rounded-xl border border-emerald-200">Target Met</span>
                <span class="px-3 py-1.5 bg-amber-50 text-amber-700 rounded-xl border border-amber-200">Moderate Risk</span>
                <span class="px-3 py-1.5 bg-rose-50 text-rose-700 rounded-xl border border-rose-200">High Risk</span>
            </div>
        </div>

        <!-- Hub Cards Grid -->
        <div id="hubsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Dynamically populated -->
        </div>

        <!-- EMO Detailed Table Section -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mt-8">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 class="font-bold text-sm text-slate-800 flex items-center gap-2">
                    <span>📋</span> Hourly EMO Performance Table
                </h3>
                <span id="rowCount" class="text-xs text-slate-500 font-medium">0 hubs listed</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-slate-100/80 text-slate-700 font-bold border-b border-slate-200">
                            <th class="p-3 sticky left-0 bg-slate-100 z-10">Hub</th>
                            <th class="p-3 text-center">Total OFD</th>
                            <th class="p-3 text-center">7 AM</th>
                            <th class="p-3 text-center">8 AM</th>
                            <th class="p-3 text-center">9 AM</th>
                            <th class="p-3 text-center">10 AM</th>
                            <th class="p-3 text-center">12 PM</th>
                            <th class="p-3 text-center">2 PM</th>
                            <th class="p-3 text-center">4 PM</th>
                            <th class="p-3 text-center">After 4 PM</th>
                        </tr>
                    </thead>
                    <tbody id="emoTableBody" class="divide-y divide-slate-100">
                        <!-- Dynamically populated -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto py-4 bg-white border-t border-slate-200 text-center text-xs text-slate-400">
        <p>© 2026 EMO HUB WISE. All rights reserved.</p>
    </footer>

    <!-- Script to Fetch and Render Data -->
    <script>
        // REPLACE THIS URL WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
        const APPS_SCRIPT_URL = localStorage.getItem('emo_script_url') || prompt("Please enter your Google Apps Script Web App URL:") || "";
        if (APPS_SCRIPT_URL) {
            localStorage.setItem('emo_script_url', APPS_SCRIPT_URL);
        }

        let globalData = {};

        async function loadData() {
            if (!APPS_SCRIPT_URL) {
                alert("Please configure your Google Apps Script Web App URL!");
                return;
            }
            try {
                const res = await fetch(APPS_SCRIPT_URL);
                const json = await res.json();
                processData(json);
            } catch (err) {
                console.error("Error fetching data:", err);
                alert("Failed to fetch data from Google Sheet. Check CORS or URL.");
            }
        }

        function processData(rows) {
            const db = {};
            rows.forEach(item => {
                const keys = Object.keys(item);
                const getVal = (kList) => {
                    for (const k of kList) {
                        const found = keys.find(orig => orig.toLowerCase().includes(k));
                        if (found && item[found] !== undefined) return item[found];
                    }
                    return '';
                };

                const hub = String(item[keys[0]] || getVal(['hub', 'name'])).replace(/["']/g, '').trim();
                if (!hub || hub.toLowerCase() === 'hub') return;

                const ofd = parseFloat(String(item[keys[1]] || getVal(['ofd', 'total'])).replace(/["'%]/g, '').replace(/,/g, '')) || 0;
                let rawDate = item[keys[keys.length - 1]] || getVal(['date']) || '2026-09-01';
                const date = String(rawDate).split('T')[0].split(' ')[0];

                const parseNum = (val) => parseFloat(String(val || 0).replace(/["'%]/g, '').replace(/,/g, '')) || 0;
                const parseStr = (val) => {
                    const n = parseFloat(String(val || 0).replace(/["'%]/g, '').replace(/,/g, ''));
                    return !isNaN(n) ? n.toFixed(2) : "0.00";
                };

                const ofd7 = parseNum(item[keys[2]]);
                const emo7 = parseStr(item[keys[3]]);
                const ofd8 = parseNum(item[keys[4]]);
                const emo8 = parseStr(item[keys[5]]);
                const ofd9 = parseNum(item[keys[6]]);
                const emo9 = parseStr(item[keys[7]]);
                const ofd10 = parseNum(item[keys[8]]);
                const emo10 = parseStr(item[keys[9]]);
                const ofd12 = parseNum(item[keys[10]]);
                const emo12 = parseStr(item[keys[11]]);
                const ofd2 = parseNum(item[keys[12]]);
                const emo2 = parseStr(item[keys[13]]);
                const ofd4 = parseNum(item[keys[14]]);
                const emo4 = parseStr(item[keys[15]]);
                const ofdAfter = parseNum(item[keys[16]]);
                const emoAfter = parseStr(item[keys[17]]);

                const currentEmo = parseFloat(emoAfter !== "0.00" ? emoAfter : emo4);
                let risk = "Target Met", riskBg = "bg-emerald-100 text-emerald-800 border-emerald-300", dotColor = "bg-emerald-500";
                if (currentEmo < 75) {
                    risk = "High Risk"; riskBg = "bg-rose-100 text-rose-800 border-rose-300"; dotColor = "bg-rose-500";
                } else if (currentEmo < 90) {
                    risk = "Moderate"; riskBg = "bg-amber-100 text-amber-800 border-amber-300"; dotColor = "bg-amber-500";
                }

                if (!db[date]) db[date] = {};
                db[date][hub] = {
                    ofd, risk, riskBg, dotColor,
                    ofd7, emo7, ofd8, emo8, ofd9, emo9,
                    ofd10, emo10, ofd12, emo12, ofd2, emo2,
                    ofd4, emo4, ofdAfter, emoAfter
                };
            });

            globalData = db;
            populateDates();
        }

        function populateDates() {
            const dates = Object.keys(globalData).sort();
            const select = document.getElementById('dateSelect');
            select.innerHTML = '';
            if (dates.length === 0) {
                select.innerHTML = '<option>No dates available</option>';
                return;
            }
            dates.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                select.appendChild(opt);
            });
            select.value = dates[dates.length - 1]; // Latest date
            select.onchange = renderDashboard;
            renderDashboard();
        }

        function renderDashboard() {
            const selectedDate = document.getElementById('dateSelect').value;
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const dayData = globalData[selectedDate] || {};

            const grid = document.getElementById('hubsGrid');
            const tbody = document.getElementById('emoTableBody');
            grid.innerHTML = '';
            tbody.innerHTML = '';

            let count = 0;
            Object.entries(dayData).forEach(([hub, data]) => {
                if (searchQuery && !hub.toLowerCase().includes(searchQuery)) return;
                count++;

                // Hub Card
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition-all space-y-3';
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-sm text-slate-900">${hub}</h4>
                            <p class="text-[11px] text-slate-500">Total OFD: <span class="font-bold text-slate-700">${data.ofd}</span></p>
                        </div>
                        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold border ${data.riskBg}">
                            ${data.risk}
                        </span>
                    </div>
                    <div class="grid grid-cols-4 gap-1 text-center pt-2 border-t border-slate-100 text-[10px]">
                        <div class="bg-slate-50 p-1 rounded"><span class="block text-slate-400">10 AM</span><span class="font-bold text-slate-700">${data.emo10}%</span></div>
                        <div class="bg-slate-50 p-1 rounded"><span class="block text-slate-400">12 PM</span><span class="font-bold text-slate-700">${data.emo12}%</span></div>
                        <div class="bg-slate-50 p-1 rounded"><span class="block text-slate-400">2 PM</span><span class="font-bold text-slate-700">${data.emo2}%</span></div>
                        <div class="bg-slate-50 p-1 rounded"><span class="block text-slate-400">4 PM</span><span class="font-bold text-slate-700">${data.emo4}%</span></div>
                    </div>
                `;
                grid.appendChild(card);

                // Table Row
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition-colors';
                tr.innerHTML = `
                    <td class="p-3 font-bold text-slate-900 sticky left-0 bg-white border-r border-slate-100">${hub}</td>
                    <td class="p-3 text-center font-bold text-slate-800">${data.ofd}</td>
                    <td class="p-3 text-center"><div class="font-bold">${data.ofd7}</div><div class="text-[10px] text-emerald-600 font-medium">${data.emo7}%</div></td>
                    <td class="p-3 text-center"><div class="font-bold">${data.ofd8}</div><div class="text-[10px] text-emerald-600 font-medium">${data.emo8}%</div></td>
                    <td class="p-3 text-center"><div class="font-bold">${data.ofd9}</div><div class="text-[10px] text-emerald-600 font-medium">${data.emo9}%</div></td>
                    <td class="p-3 text-center"><div class="font-bold">${data.ofd10}</div><div class="text-[10px] text-emerald-600 font-medium">${data.emo10}%</div></td>
                    <td class="p-3 text-center"><div class="font-bold">${data.ofd12}</div><div class="text-[10px] text-emerald-600 font-medium">${data.emo12}%</div></td>
                    <td class="p-3 text-center"><div class="font-bold">${data.ofd2}</div><div class="text-[10px] text-emerald-600 font-medium">${data.emo2}%</div></td>
                    <td class="p-3 text-center"><div class="font-bold">${data.ofd4}</div><div class="text-[10px] text-emerald-600 font-medium">${data.emo4}%</div></td>
                    <td class="p-3 text-center"><div class="font-bold">${data.ofdAfter}</div><div class="text-[10px] text-emerald-600 font-medium">${data.emoAfter}%</div></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('rowCount').textContent = `${count} hubs listed`;
        }

        // Auto load on start if URL exists
        if (APPS_SCRIPT_URL) {
            loadData();
        }
    </script>
</body>
</html>
